experiment:
  run_name: hbgnet_fhapd_js_sr_v2_rd_v9_seed73
  stage: FHAPD_JS_seed73_combined
dataset:
  name: FHAPD_JS
  variant: spatial_nonoverlap_v1
  variants:
    spatial_nonoverlap_v1:
      protocol: FHAPD-ProtocolB-compatible-spatial-v1
      purpose: within_region_spatial_holdout
      root: /root/wyk5/dataset/FHAPD_JS_protocol_b_v1
      image_dir: /root/wyk5/dataset/FHAPD_JS_protocol_b_v1/images
      mask_dir: /root/wyk5/dataset/FHAPD_JS_protocol_b_v1/masks
      manifests:
        train: /root/wyk5/RGVNet/splits/fhapd_js/train.txt
        val: /root/wyk5/RGVNet/splits/fhapd_js/val.txt
        test: /root/wyk5/RGVNet/splits/fhapd_js/test.txt
      image_suffix: .png
      mask_suffix: .tif
      input_size:
      - 256
      - 256
  image_bands:
  - 1
  - 2
  - 3
  region_band: 1
  boundary_band: 2
  distance_band: 3
  expected_counts:
    train: 592
    val: 117
    test: 142
  batch_size: 8
  val_batch_size: 8
  num_workers: 8
  persistent_workers: false
augmentation:
  enabled: true
  horizontal_flip_probability: 0.5
  vertical_flip_probability: 0.5
  rotate_90_probability: 0.5
normalization:
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
model:
  name: HBGNet
  backbone: pvt_v2_b2
  channel: 32
  boundary_classes: 2
  drop_rate: 0.4
  pretrained_path: /root/wyk5/RGVNet/models/hbgnet_fhapd_js_sr_v2_rd_v9_seed73/pretrained/pvt_v2_b2.pth
  refinement:
    enabled: true
    max_delta: 2.0
    checkpoint_groups: true
    mode: local_separation_v2
    hidden_channels: 16
    path_channels: 4
    radii:
    - 2
    - 4
    verifier:
      enabled: true
      mode: enabled
      aggregation: multi_scale_support
loss:
  name: rd_v9_context_fullloss_sr_band
  raw_region_weight: 0.5
  sr_region_weight: 0.5
  raw_band_weight: 0.125
  sr_band_weight: 0.125
  band_radius_pixels: 2
  verifier_weight: 1.0
  verifier_loss_mode: ordinary_bce_present_direction_average
  final_region_loss: false
  weights:
  - 1
  - 1
  - 1
training:
  epochs: 40
  gradient_accumulation_steps: 2
  amp: false
  optimizer: Adam
  learning_rate: 0.0001
  weight_decay: 0.0
  scheduler: CosineAnnealingLR
  scheduler_t_max: 10000000000
  min_lr: 1.0e-05
  validation_interval: 2
  final_validation_epochs: 5
  log_interval: 20
  selection: 0.7_iou_0.3_bf1
  seed: 73
  iou_floor: null
evaluation:
  protocol: HBGNet-metrics-FHAPD-256-3px-spatial-v1
  region_threshold: 0.5
  threshold_comparison: '>'
  primary_output: region
  tta: false
  small_object_removal: false
  spatial_resolution_m: null
  boundary_tolerance_m: null
  requested_boundary_tolerance_m: 3.0
  boundary_tolerance_pixels: 3
  physical_tolerance_verified: false
  physical_resolution_evidence: Source PNG files have no CRS/geotransform; identity
    pixel transform is not GSD.
  aggregation: region_micro_boundary_micro_object_global_area_weighted
  primary_metrics:
  - f1
  - iou
  - f_boundary
  - goc
  - guc
  - gtc
  diagnostic_metrics:
  - oa
  - precision
  - recall
  - boundary_completeness
  - boundary_correctness
  narrow_structure_metrics:
    status: not_defined_in_frozen_evaluator
    value: null
paths:
  train_log_root: /root/wyk5/RGVNet/z_1_trainning_log/FHAPD_JS
  test_log_root: /root/wyk5/RGVNet/z_2_test/FHAPD_JS
  weights_root: /root/wyk5/RGVNet/z_3_weights/FHAPD_JS
  results_root: /root/wyk5/RGVNet/z_4_results/FHAPD_JS
